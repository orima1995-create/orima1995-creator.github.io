media:
  input: public/images
  output: /images
  rename: false
  categories: [image]

content:
  - name: watches
    label: Watches
    type: collection
    path: src/content/watches
    fields:
      - name: slug
        label: Slug
        type: string
        required: true
        readonly: true
      - name: ownerNumber
        label: OWNER'S NOTE No.
        type: string
        required: true
      - name: brand
        label: Brand
        type: string
        required: true
      - name: model
        label: Model
        type: string
        required: true
      - name: catch
        label: Catch
        type: string
        list:
          min: 2
          max: 2
      - name: ownersNote
        label: OWNER'S NOTE
        type: object
        fields:
          - name: image
            label: Artwork
            type: image
            required: true
          - name: lead
            label: Lead
            type: text
            list: true
          - name: guideTitle
            label: Guide title
            type: string
          - name: guide
            label: Guide
            type: text
            list: true
          - name: noteTitle
            label: Note title
            type: string
          - name: note
            label: Note
            type: text
            list: true
      - name: spec
        label: SPEC
        type: object
        fields:
          - { name: era, label: 年代, type: string }
          - { name: caseSize, label: ケースサイズ, type: string }
          - { name: caliber, label: Cal, type: string }
          - { name: jewels, label: 石, type: string }
          - { name: frequency, label: 振動, type: string }
          - { name: barrels, label: 香箱, type: string }
          - { name: winding, label: 手巻き, type: string }
          - { name: acoustic, label: 音響, type: string }
          - { name: notes, label: 特記事項, type: text }
      - name: video
        label: 実機鳴動
        type: object
        fields:
          - { name: youtubeId, label: YouTube ID, type: string }
          - { name: xUrl, label: Original post on X, type: string }
      - name: deepDive
        label: DEEP DIVE
        type: object
        list:
          min: 1
          max: 8
          collapsible:
            collapsed: true
            summary: "{number}｜{title}"
        fields:
          - { name: number, label: No., type: string }
          - { name: title, label: Title, type: string }
          - { name: subtitle, label: Subtitle, type: string }
          - name: paragraphs
            label: Paragraphs
            type: text
            list: true
      - name: sources
        label: 参考資料・出典
        type: string
        list: true

  - name: history
    label: HISTORY 編集
    type: file
    path: src/data/history-content.json
    format: json
    fields:
      - name: hero
        label: 冒頭 / HERO
        type: object
        required: true
        fields:
          - { name: eyebrow, label: 英文見出し, type: string }
          - { name: title, label: タイトル, type: string }
          - name: kicker
            label: 導入2行
            type: string
            list:
              min: 2
              max: 2
          - name: lead
            label: 導入本文
            type: text
            list: true
          - { name: emphasisLead, label: 強調前, type: string }
          - { name: emphasis, label: 強調文, type: text }
          - { name: tail, label: 締め, type: text }

      - name: before
        label: 00 / BEFORE THE WRIST
        type: object
        required: true
        fields:
          - { name: chapterNo, label: Chapter No., type: string, readonly: true }
          - { name: label, label: 章ラベル, type: string, readonly: true }
          - { name: title, label: 章タイトル, type: string }
          - { name: teaser, label: 目次・要約, type: text }
          - { name: overline, label: Overline, type: string }
          - name: intro
            label: 導入本文
            type: text
            list: true
          - { name: infrastructureEmphasis, label: 強調文, type: text }
          - { name: turnLead, label: 転換文 前半, type: string }
          - { name: turnStrong, label: 転換文 強調, type: string }
          - { name: portableTitle, label: 小見出し / ポケットへ, type: string }
          - name: portable
            label: ポケットへ 本文
            type: text
            list: true
          - { name: portableEmphasis, label: ポケットへ 強調, type: text }
          - { name: alarmTitle, label: 小見出し / アラームへ, type: string }
          - name: alarm
            label: アラームへ 本文
            type: text
            list: true

      - name: era1910s
        label: 01 / 1910s
        type: object
        required: true
        fields:
          - { name: chapterNo, label: Chapter No., type: string, readonly: true }
          - { name: label, label: 章ラベル, type: string, readonly: true }
          - { name: title, label: 章タイトル, type: string }
          - { name: teaser, label: 目次・要約, type: text }
          - { name: overline, label: Overline, type: string }
          - { name: intro, label: 本文, type: text }

      - name: era1940s
        label: 02 / 1940s
        type: object
        required: true
        fields:
          - { name: chapterNo, label: Chapter No., type: string, readonly: true }
          - { name: label, label: 章ラベル, type: string, readonly: true }
          - { name: title, label: 章タイトル, type: string }
          - { name: teaser, label: 目次・要約, type: text }
          - { name: overline, label: Overline, type: string }
          - { name: problemTitleLead, label: 問題提起 前半, type: string }
          - { name: problemTitleStrong, label: 問題提起 強調, type: string }
          - name: problemLines
            label: 問題点
            type: string
            list: true
          - { name: problemStrong, label: 問題点 強調, type: string }
          - { name: problemCopy, label: 本文, type: text }

      - name: era1950s
        label: 03 / 1950s
        type: object
        required: true
        fields:
          - { name: chapterNo, label: Chapter No., type: string, readonly: true }
          - { name: label, label: 章ラベル, type: string, readonly: true }
          - { name: title, label: 章タイトル, type: string }
          - { name: teaser, label: 目次・要約, type: text }
          - { name: thesis, label: Thesis, type: string }
          - { name: lead, label: 導入本文, type: text }
          - { name: editorialLead, label: 編集方針 前半, type: text }
          - { name: editorialStrong, label: 編集方針 強調, type: text }
          - { name: editorialTail, label: 編集方針 後半, type: string }

      - name: era1960s
        label: 04 / 1960s–70s
        type: object
        required: true
        fields:
          - { name: chapterNo, label: Chapter No., type: string, readonly: true }
          - { name: label, label: 章ラベル, type: string, readonly: true }
          - { name: title, label: 章タイトル, type: string }
          - { name: teaser, label: 目次・要約, type: text }
          - { name: intro, label: 導入本文, type: text }
          - name: branches
            label: BRANCHES
            type: object
            list:
              min: 1
              max: 8
              collapsible:
                collapsed: true
                summary: "{meta} / {name}"
            fields:
              - { name: meta, label: Meta, type: string }
              - { name: name, label: Name, type: string }
              - { name: hook, label: Hook, type: text }
              - { name: summary, label: Summary, type: text }
              - { name: status, label: Status, type: string }

      - name: electronic
        label: 05 / QUARTZ・DIGITAL
        type: object
        required: true
        fields:
          - { name: chapterNo, label: Chapter No., type: string, readonly: true }
          - { name: label, label: 章ラベル, type: string, readonly: true }
          - { name: title, label: 章タイトル, type: string }
          - { name: indexTitle, label: 目次タイトル, type: string }
          - { name: teaser, label: 目次・要約, type: text }
          - name: body
            label: 本文
            type: text
            list: true

      - name: current
        label: 06 / CURRENT
        type: object
        required: true
        fields:
          - { name: chapterNo, label: Chapter No., type: string, readonly: true }
          - { name: storyNo, label: Story No., type: string, readonly: true }
          - { name: title, label: タイトル, type: string }
          - { name: name, label: 表示名, type: string }
          - { name: linkLabel, label: リンク文言, type: string }
          - { name: href, label: リンク先, type: string, readonly: true }

      - name: sources
        label: 参考資料・出典
        type: object
        required: true
        fields:
          - { name: summary, label: 見出し, type: string }
          - name: items
            label: 出典
            type: text
            list: true
