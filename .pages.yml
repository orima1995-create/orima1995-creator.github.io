media:
  input: public/images
  output: /images
  rename: false
  categories: [image]

content:
  - name: watches
    label: Watches
    type: collection
    path: src/content/watches
    fields:
      - name: slug
        label: Slug
        type: string
        required: true
        readonly: true
      - name: ownerNumber
        label: OWNER'S NOTE No.
        type: string
        required: true
      - name: brand
        label: Brand
        type: string
        required: true
      - name: model
        label: Model
        type: string
        required: true
      - name: catch
        label: Catch
        type: string
        list:
          min: 2
          max: 2
      - name: ownersNote
        label: OWNER'S NOTE
        type: object
        fields:
          - name: image
            label: Artwork
            type: image
            required: true
          - name: lead
            label: Lead
            type: text
            list: true
          - name: guideTitle
            label: Guide title
            type: string
          - name: guide
            label: Guide
            type: text
            list: true
          - name: noteTitle
            label: Note title
            type: string
          - name: note
            label: Note
            type: text
            list: true
      - name: spec
        label: SPEC
        type: object
        fields:
          - { name: era, label: 年代, type: string }
          - { name: caseSize, label: ケースサイズ, type: string }
          - { name: caliber, label: Cal, type: string }
          - { name: jewels, label: 石, type: string }
          - { name: frequency, label: 振動, type: string }
          - { name: barrels, label: 香箱, type: string }
          - { name: winding, label: 手巻き, type: string }
          - { name: acoustic, label: 音響, type: string }
          - { name: notes, label: 特記事項, type: text }
      - name: video
        label: 実機鳴動
        type: object
        fields:
          - { name: youtubeId, label: YouTube URL / ID, type: string }
          - { name: xUrl, label: Original post on X, type: string }
      - name: deepDive
        label: DEEP DIVE
        type: object
        list:
          min: 1
          max: 8
          collapsible:
            collapsed: true
            summary: "{number}｜{title}"
        fields:
          - { name: number, label: No., type: string }
          - { name: title, label: Title, type: string }
          - { name: subtitle, label: Subtitle, type: string }
          - name: paragraphs
            label: Paragraphs
            type: text
            list: true
          - name: images
            label: 補足画像
            type: object
            list:
              max: 8
              collapsible:
                collapsed: true
                summary: "{caption}"
            fields:
              - { name: src, label: 画像, type: image, required: true }
              - { name: caption, label: キャプション, type: text }
              - { name: alt, label: altテキスト, type: string }
      - name: sources
        label: 参考資料・出典
        type: string
        list: true

  - name: ownersDirectory
    label: OWNER'S NOTES 一覧
    type: file
    path: src/data/owners-directory.json
    format: json
    fields:
      - name: entries
        label: 所有個体カード
        type: object
        list:
          min: 1
          max: 100
          collapsible:
            collapsed: true
            summary: "{ownedEra} / {brand} {name}"
        fields:
          - { name: ownerNumber, label: OWNER'S NOTE No., type: string }
          - { name: ownedEra, label: 所有個体の年代区分, type: string }
          - { name: ownedSortYear, label: 所有個体の並び順年, type: number }
          - { name: brand, label: Brand, type: string }
          - { name: name, label: Model, type: string }
          - { name: catch, label: 一覧専用キャッチ, type: string }
          - { name: image, label: カード画像, type: image }
          - { name: href, label: OWNER'S NOTEリンク, type: string }

  - name: history
    label: HISTORY 編集
    type: file
    path: src/data/history-content.json
    format: json
    fields:
      - name: hero
        label: 冒頭 / HERO
        type: object
        required: true
        fields:
          - { name: eyebrow, label: 英文見出し, type: string }
          - { name: title, label: タイトル, type: string }
          - name: kicker
            label: 導入2行
            type: string
            list:
              min: 2
              max: 2
          - name: lead
            label: 導入本文
            type: text
            list: true

      - name: before
        label: 00 / BEFORE THE WRIST
        type: object
        required: true
        fields:
          - { name: chapterNo, label: Chapter No., type: string, readonly: true }
          - { name: label, label: 章ラベル, type: string, readonly: true }
          - { name: title, label: 章タイトル, type: string }
          - { name: teaser, label: 目次・要約, type: text }
          - { name: overline, label: Overline, type: string }
          - name: intro
            label: 導入本文
            type: text
            list: true

      - name: era1910s
        label: 01 / 1910s
        type: object
        required: true
        fields:
          - { name: chapterNo, label: Chapter No., type: string, readonly: true }
          - { name: label, label: 章ラベル, type: string, readonly: true }
          - { name: title, label: 章タイトル, type: string }
          - { name: teaser, label: 目次・要約, type: text }
          - { name: overline, label: Overline, type: string }
          - { name: intro, label: 本文, type: text }
          - name: cards
            label: HISTORYカード
            type: object
            list:
              max: 30
              collapsible:
                collapsed: true
                summary: "{group} / {name}"
            fields:
              - { name: id, label: ID, type: string, readonly: true }
              - { name: group, label: 分類, type: string, readonly: true }
              - { name: sort, label: 並び順, type: number, readonly: true }
              - { name: meta, label: 上部表記, type: string }
              - { name: name, label: カード名, type: string }
              - { name: hook, label: フック, type: text }
              - { name: cardSummary, label: 要約, type: text }
              - { name: cardStatus, label: ステータス表示, type: string }
              - { name: featured, label: 掲載, type: boolean, readonly: true }
              - { name: href, label: リンク先, type: string, readonly: true }
              - { name: hrefKind, label: リンク種別, type: string, readonly: true }

      - name: era1940s
        label: 02 / 1940s
        type: object
        required: true
        fields:
          - { name: chapterNo, label: Chapter No., type: string, readonly: true }
          - { name: label, label: 章ラベル, type: string, readonly: true }
          - { name: title, label: 章タイトル, type: string }
          - { name: teaser, label: 目次・要約, type: text }
          - { name: overline, label: Overline, type: string }
          - { name: intro, label: 本文, type: text }
          - name: cards
