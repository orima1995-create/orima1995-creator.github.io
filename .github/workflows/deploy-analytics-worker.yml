name: Deploy Analytics Worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-analytics-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canonical/cloudflare/analytics-dashboard
    steps:
      - name: Checkout deployment bridge
        uses: actions/checkout@v4
        with:
          path: bridge

      - name: Checkout canonical VINTAGE ALARM source
        uses: actions/checkout@v4
        with:
          repository: vintagealarm/vintagealarm.github.io
          ref: main
          path: canonical
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Check canonical analytics source
        run: |
          node --check worker.js
          node --check profile-worker.js
          node check-generated-html.mjs
          node check-profile-wrapper.mjs

      - name: Require deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Deploy canonical Analytics Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
