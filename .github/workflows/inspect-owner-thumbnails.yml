name: Inspect owner thumbnail sources
on:
  push:
    branches: ["hotfix/rebuild-owner-thumbnails"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: current-owner-thumbnail-files
          path: public/images/owners-thumbnails
          retention-days: 1
