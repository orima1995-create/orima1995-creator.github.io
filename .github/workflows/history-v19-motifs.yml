name: HISTORY v19 Watercolor Motifs

on:
  push:
    branches: ["staging/history-v19-motifs"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Audit watercolor HISTORY
        env:
          HISTORY_SCREENSHOT_DIR: .history-review
        run: node scripts/check-history-v19.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-v19-watercolor-review
          path: |
            dist/history
            .history-review
          include-hidden-files: true
          retention-days: 7
