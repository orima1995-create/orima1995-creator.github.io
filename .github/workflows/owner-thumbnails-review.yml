name: Owner thumbnail visual audit
on:
  push:
    branches: ["staging/owners-thumbnails-v17"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm run build
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - env:
          OWNER_SCREENSHOT_DIR: .owner-review
        run: node scripts/check-owner-thumbnails.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-thumbnails-review
          path: .owner-review
          include-hidden-files: true
          retention-days: 7
