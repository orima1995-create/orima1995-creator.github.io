name: HISTORY v21 Japanese wrap audit
on:
  push:
    branches: ["staging/history-v21-japanese-wrap"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm run build
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - env:
          HISTORY_SCREENSHOT_DIR: .history-review
        run: node scripts/check-history-v21.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-v21-japanese-wrap-review
          path: .history-review
          include-hidden-files: true
          retention-days: 7
