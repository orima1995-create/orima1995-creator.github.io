name: Astro foundation check

on:
  push:
    branches: ["refactor/astro-foundation"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify site output
        run: |
          set -e
          test -f dist/index.html
          test -f dist/owners-notes/index.html
          test -f dist/pierce-duofon/index.html
          test -f dist/cyma-time-o-vox/index.html
          test -f dist/cyma-time-o-vox/owners-note/index.html
          test -f dist/history/index.html
          test -f dist/history/smartwatch/index.html
          test -f dist/images/history/smartwatch-part-4.webp
          test -f "dist/images/cyma-time-o-vox/Cyma timeovox .png"
          test -f "dist/images/cyma-time-o-vox/ムーブメント.jpg"
          test -f dist/images/cyma-time-o-vox/wipe.jpg

          cyma_bytes=$(wc -c < "dist/images/cyma-time-o-vox/Cyma timeovox .png")
          movement_bytes=$(wc -c < "dist/images/cyma-time-o-vox/ムーブメント.jpg")
          wipe_bytes=$(wc -c < dist/images/cyma-time-o-vox/wipe.jpg)
          test "$cyma_bytes" -gt 100000 || { echo "Cyma OWNER'S NOTE PNG is unexpectedly small"; exit 1; }
          test "$movement_bytes" -gt 100000 || { echo "Cyma movement image is unexpectedly small"; exit 1; }
          test "$wipe_bytes" -gt 100000 || { echo "Cyma Wippe image is unexpectedly small"; exit 1; }

          check_text() {
            needle="$1"
            file="$2"
            grep -Fq "$needle" "$file" || { echo "missing text [$needle] in $file"; exit 1; }
          }

          check_text "PIERCE" dist/pierce-duofon/index.html
          check_text "DUOFON" dist/pierce-duofon/index.html
          check_text "マナーモードの祖先!?" dist/pierce-duofon/index.html
          check_text "① 動力巻き上げ" dist/pierce-duofon/index.html
          check_text "youtube.com/embed/xkecjZqr7BY" dist/pierce-duofon/index.html
          check_text "Pierce Cal.135" dist/pierce-duofon/index.html
          check_text "Gruen Duotoneとの関係" dist/pierce-duofon/index.html
          check_text "history/#1950s" dist/pierce-duofon/index.html

          check_text "cyma-time-o-vox/#owners-note" dist/owners-notes/index.html
          check_text "Cyma timeovox .png" dist/owners-notes/index.html

          check_text 'id="1950s"' dist/history/index.html
          check_text "PIERCE DUOFON" dist/history/index.html
          check_text "TIME-O-VOX" dist/history/index.html
          check_text "cyma-time-o-vox/" dist/history/index.html
          check_text 'id="milestones"' dist/history/index.html
          check_text 'id="research"' dist/history/index.html
          check_text "owners-notes/" dist/history/index.html
          check_text 'id="current"' dist/history/index.html
          check_text "history/smartwatch/" dist/history/index.html

          check_text "smartwatch-part-4.webp" dist/history/smartwatch/index.html
          check_text "もっと静かな時代へ戻る" dist/history/smartwatch/index.html

          check_text "Cal.R.464" dist/cyma-time-o-vox/index.html
          check_text "ムーブメント.jpg" dist/cyma-time-o-vox/index.html
          check_text "wipe.jpg" dist/cyma-time-o-vox/index.html
          check_text "Cyma timeovox .png" dist/cyma-time-o-vox/index.html
          check_text "Cyma timeovox .png" dist/cyma-time-o-vox/owners-note/index.html
          check_text "youtube.com/embed/OONH0JZqCK0" dist/cyma-time-o-vox/index.html
          check_text "2085277918473883977" dist/cyma-time-o-vox/index.html

          if find dist -name '*.html' -print0 | xargs -0 grep -q "data:image/.*base64"; then
            echo "Embedded base64 image remains in generated HTML"
            find dist -name '*.html' -print0 | xargs -0 grep -l "data:image/.*base64"
            exit 1
          fi
          if grep -R -q "word-break:[[:space:]]*break-all" dist; then
            echo "Unsafe mobile break-all rule found"
            exit 1
          fi
          for dead in '#index-milestones' '#index-owners' '#index-interests'; do
            if grep -R -Fq "$dead" dist; then
              echo "Removed navigation target remains in generated output: $dead"
              exit 1
            fi
          done
          if grep -R -Fq "runtime-menu" dist; then
            echo "Legacy runtime navigation remains in generated output"
            exit 1
          fi
