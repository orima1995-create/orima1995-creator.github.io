name: Legacy host redirect check

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify legacy migration contract
        run: |
          set -e

          check_legacy_page() {
            file="$1"
            canonical="$2"
            test -f "$file"
            grep -Fq 'name="robots" content="noindex,follow,noarchive"' "$file" || { echo "missing noindex in $file"; exit 1; }
            grep -Fq "rel=\"canonical\" href=\"$canonical\"" "$file" || { echo "wrong canonical in $file"; exit 1; }
            grep -Fq "http-equiv=\"refresh\" content=\"0;url=$canonical\"" "$file" || { echo "missing redirect in $file"; exit 1; }
          }

          check_legacy_page dist/index.html "https://vintagealarm.github.io/"
          check_legacy_page dist/history/index.html "https://vintagealarm.github.io/history/"
          check_legacy_page dist/owners-notes/index.html "https://vintagealarm.github.io/owners-notes/"
          check_legacy_page dist/pierce-duofon/index.html "https://vintagealarm.github.io/pierce-duofon/"
          check_legacy_page dist/cyma-time-o-vox/index.html "https://vintagealarm.github.io/cyma-time-o-vox/"
          check_legacy_page dist/basis-alarm/index.html "https://vintagealarm.github.io/basis-alarm/"
          check_legacy_page dist/history/smartwatch/index.html "https://vintagealarm.github.io/history/smartwatch/"

          grep -Fq '旧CMSです' .pages.yml || { echo "legacy CMS migration notice missing"; exit 1; }
          grep -Fq 'Allow: /' public/robots.txt || { echo "legacy host must remain crawlable for noindex discovery"; exit 1; }
          if grep -Fq 'Sitemap:' public/robots.txt; then
            echo "legacy robots.txt still advertises a sitemap"
            exit 1
          fi
          if grep -R -Fq '<loc>https://orima1995-create.github.io/orima1995-creator.github.io/' public/sitemap*.xml; then
            echo "legacy sitemap still advertises old URLs"
            exit 1
          fi
          if grep -R -Fq 'static.cloudflareinsights.com/beacon.min.js' dist; then
            echo "legacy pages still load analytics"
            exit 1
          fi
