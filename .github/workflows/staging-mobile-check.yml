name: Staging HISTORY v7 Check

on:
  push:
    branches: ["staging/history-v7"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard editorial content and source images
        run: |
          set -e
          git fetch origin staging/mobile-v4
          changed=$(git diff --name-only origin/staging/mobile-v4...HEAD -- \
            src/content \
            src/data/history-content.json \
            src/data/history-catalog.ts \
            src/data/owners-directory.json \
            public/images)
          if [ -n "$changed" ]; then
            echo 'Protected editorial data or source images changed in HISTORY v7:'
            echo "$changed"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify required pages
        run: |
          set -e
          for f in \
            dist/index.html \
            dist/history/index.html \
            dist/owners-notes/index.html \
            dist/pierce-duofon/index.html \
            dist/cyma-time-o-vox/index.html; do
            test -f "$f" || { echo "missing file: $f"; exit 1; }
          done

      - name: Verify HISTORY v7 editorial structure
        run: |
          set -e
          grep -Fq 'v7-hero-milestone' dist/history/index.html || { echo '1910s hero milestone missing'; exit 1; }
          grep -Fq 'v7-1940-grid' dist/history/index.html || { echo '1940s split layout missing'; exit 1; }
          grep -Fq 'v7-milestone-rail' dist/history/index.html || { echo '1950s milestone rail missing'; exit 1; }
          grep -Fq 'v7-owner-posters' dist/history/index.html || { echo '1950s owner poster stage missing'; exit 1; }
          grep -Fq 'v7-compare' dist/history/index.html || { echo '1960s comparison layout missing'; exit 1; }
          grep -Fq 'v7-transition' dist/history/index.html || { echo '1970s transition layout missing'; exit 1; }
          grep -Fq 'v7-current' dist/history/index.html || { echo 'CURRENT ending missing'; exit 1; }
          grep -Fq 'v7-next' dist/history/index.html || { echo 'RESEARCH exit missing'; exit 1; }
          grep -Fq '所有個体から見る。' dist/history/index.html || { echo "OWNER'S NOTE definition missing"; exit 1; }
          grep -Fq '次に気になっているものと、そのデータ。' dist/history/index.html || { echo 'RESEARCH definition missing'; exit 1; }
          if grep -Fq 'history-v5-record' dist/history/index.html; then
            echo 'legacy repeated record layout remains'
            exit 1
          fi
          if grep -Fq 'history-v5-research' dist/history/index.html; then
            echo 'RESEARCH rendered as HISTORY chapter'
            exit 1
          fi

      - name: Verify TOP v4 stays intact
        run: |
          set -e
          grep -Fq 'home-v4-cover' dist/index.html
          grep -Fq '現代の感覚で読む。' dist/index.html
          grep -Fq '所有個体から見る。' dist/index.html
          grep -Fq '次に気になっているものと、そのデータ。' dist/index.html

      - name: Guard watch invariants
        run: |
          set -e
          grep -Fq '鳴る黄金のクロノメーター' dist/cyma-time-o-vox/index.html
          grep -Fq '通知のオーパーツ' dist/pierce-duofon/index.html
          grep -Fq '1香箱' dist/cyma-time-o-vox/index.html
          grep -Fq '2香箱' dist/pierce-duofon/index.html

      - name: Guard small-screen CSS
        run: |
          set -e
          if grep -R -Fq 'word-break:break-all' dist/_astro; then
            echo 'break-all detected'
            exit 1
          fi
          if grep -R -Eiq 'width:[[:space:]]*[1-9][0-9]{3,}px' dist/_astro; then
            echo 'suspicious fixed width >= 1000px detected'
            exit 1
          fi

      - name: Upload staging build artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-history-v7-dist
          path: dist
          retention-days: 7
