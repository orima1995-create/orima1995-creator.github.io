name: Staging Mobile v3 Check

on:
  push:
    branches: ["staging/mobile-v3"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard design-only scope
        run: |
          set -e
          git fetch origin main
          changed=$(git diff --name-only origin/main...HEAD -- \
            src/content \
            src/data/history-content.json \
            src/data/history-catalog.ts \
            src/data/owners-directory.json \
            public/images)
          if [ -n "$changed" ]; then
            echo 'Editorial content or source images changed in mobile staging:'
            echo "$changed"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify required pages
        run: |
          set -e
          for f in \
            dist/index.html \
            dist/history/index.html \
            dist/owners-notes/index.html \
            dist/pierce-duofon/index.html \
            dist/cyma-time-o-vox/index.html; do
            test -f "$f" || { echo "missing file: $f"; exit 1; }
          done

      - name: Verify mobile v3 TOP structure
        run: |
          set -e
          grep -Fq 'home-v3-cover' dist/index.html || { echo 'v3 cover missing'; exit 1; }
          grep -Fq 'COLLECTION PHOTOGRAPH / TEMP' dist/index.html || { echo 'cover photo placeholder missing'; exit 1; }
          grep -Fq 'home-v3-history' dist/index.html || { echo 'history primary route missing'; exit 1; }
          grep -Fq 'home-v3-secondary' dist/index.html || { echo 'research secondary route missing'; exit 1; }
          if grep -Fq "OWNER'S NOTE /" dist/index.html; then
            echo "OWNER'S NOTE feature leaked into TOP"
            exit 1
          fi
          if grep -Fq 'MILESTONES' dist/index.html; then
            echo 'MILESTONES duplicated on TOP'
            exit 1
          fi
          grep -Fq 'owners-mobile-rail' dist/owners-notes/index.html || { echo 'mobile owners rail missing'; exit 1; }
          grep -R -Fq 'prefers-reduced-motion' dist/_astro || { echo 'mobile shared CSS missing from build'; exit 1; }

      - name: Guard editorial output
        run: |
          set -e
          grep -Fq '鳴る黄金のクロノメーター' dist/cyma-time-o-vox/index.html
          grep -Fq '通知のオーパーツ' dist/pierce-duofon/index.html
          grep -Fq '1香箱' dist/cyma-time-o-vox/index.html
          grep -Fq '2香箱' dist/pierce-duofon/index.html

      - name: Guard small-screen CSS
        run: |
          set -e
          if grep -R -Fq 'word-break:break-all' dist/_astro; then
            echo 'break-all detected'
            exit 1
          fi
          if grep -R -Eiq 'width:[[:space:]]*[1-9][0-9]{3,}px' dist/_astro; then
            echo 'suspicious fixed width >= 1000px detected'
            exit 1
          fi

      - name: Upload staging build artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-mobile-v3-dist
          path: dist
          retention-days: 7
