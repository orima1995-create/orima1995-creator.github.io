name: Staging HISTORY v12 Check

on:
  push:
    branches: ["staging/history-v12"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard TOP, editorial data and original images
        run: |
          set -e
          git fetch origin staging/history-v11
          changed=$(git diff --name-only origin/staging/history-v11...HEAD -- src/pages/index.astro src/content src/data public/images src/styles/site.css src/styles/mobile-v1.css)
          if [ -n "$changed" ]; then
            echo "Protected source changed: $changed"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Install browser audit runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Audit actual layout and interactions at 320, 390, 768 and 1280 pixels
        env:
          HISTORY_SCREENSHOT_DIR: .history-review
        run: node scripts/check-history-layout.mjs
      - name: Guard existing pages and watch invariants
        run: |
          set -e
          for f in dist/index.html dist/history/index.html dist/owners-notes/index.html dist/pierce-duofon/index.html dist/cyma-time-o-vox/index.html; do
            test -f "$f"
          done
          grep -Fq 'home-v4-cover' dist/index.html
          grep -Fq '1香箱' dist/cyma-time-o-vox/index.html
          grep -Fq '2香箱' dist/pierce-duofon/index.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-history-v12-review
          path: |
            dist
            .history-review
          include-hidden-files: true
          retention-days: 7
