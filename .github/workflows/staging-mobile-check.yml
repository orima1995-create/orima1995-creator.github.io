name: Staging HISTORY v10 Check

on:
  push:
    branches: ["staging/history-v10"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard editorial content and source images
        run: |
          set -e
          git fetch origin staging/mobile-v4
          changed=$(git diff --name-only origin/staging/mobile-v4...HEAD -- \
            src/content \
            src/data/history-content.json \
            src/data/history-catalog.ts \
            src/data/owners-directory.json \
            public/images)
          if [ -n "$changed" ]; then
            echo 'Protected editorial data or source images changed in HISTORY v10:'
            echo "$changed"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify required pages
        run: |
          set -e
          for f in \
            dist/index.html \
            dist/history/index.html \
            dist/owners-notes/index.html \
            dist/pierce-duofon/index.html \
            dist/cyma-time-o-vox/index.html; do
            test -f "$f" || { echo "missing file: $f"; exit 1; }
          done

      - name: Verify HISTORY v10 completion criteria
        run: |
          set -e

          grep -Fq 'history-v10' dist/history/index.html || { echo 'v10 marker missing'; exit 1; }
          grep -Fq 'v10-cover' dist/history/index.html || { echo 'HISTORY cover missing'; exit 1; }
          grep -Fq 'v10-milestone-rail' dist/history/index.html || { echo 'milestone rail missing'; exit 1; }
          grep -Fq 'v10-owner-rail' dist/history/index.html || { echo 'owner note rail missing'; exit 1; }
          grep -Fq 'v10-owner-line' dist/history/index.html || { echo 'single owner note row missing'; exit 1; }

          grep -Fq 'grid-auto-columns:calc((100% - 8px)/2)' src/styles/history-v8.css || {
            echo 'mobile rails are not exactly two-up'
            exit 1
          }

          grep -Fq 'object-fit:contain' src/styles/history-v8.css || {
            echo 'owner-note images are not contained'
            exit 1
          }

          if grep -Fq 'object-fit:cover' src/styles/history-v8.css; then
            echo 'cropping rule detected in HISTORY v10'
            exit 1
          fi

          if grep -Fq 'margin-right:calc((100vw' src/styles/history-v8.css; then
            echo 'partial-card teaser layout detected'
            exit 1
          fi

          grep -Fq -- '--paper:#f2f0ea' src/styles/history-v8.css || { echo 'neutral paper palette missing'; exit 1; }
          grep -Fq -- '--ink:#1c1a17' src/styles/history-v8.css || { echo 'neutral ink palette missing'; exit 1; }
          grep -Fq -- '--soft:#6f6a61' src/styles/history-v8.css || { echo 'AA soft text palette missing'; exit 1; }
          grep -Fq -- '--red:#8b3a32' src/styles/history-v8.css || { echo 'muted accent palette missing'; exit 1; }

          grep -Fq '所有個体から見る。' dist/history/index.html || { echo "OWNER'S NOTE definition missing"; exit 1; }
          grep -Fq '次に気になっているものと、そのデータ。' dist/history/index.html || { echo 'RESEARCH definition missing'; exit 1; }

          if grep -Fq 'history-v9' dist/history/index.html; then
            echo 'legacy v9 markup remains'
            exit 1
          fi

          if grep -Fq 'is-dark' dist/history/index.html; then
            echo 'mid-page dark milestone card remains'
            exit 1
          fi

      - name: Verify TOP v4 stays intact
        run: |
          set -e
          grep -Fq 'home-v4-cover' dist/index.html
          grep -Fq '現代の感覚で読む。' dist/index.html
          grep -Fq '所有個体から見る。' dist/index.html
          grep -Fq '次に気になっているものと、そのデータ。' dist/index.html

      - name: Guard watch invariants
        run: |
          set -e
          grep -Fq '鳴る黄金のクロノメーター' dist/cyma-time-o-vox/index.html
          grep -Fq '通知のオーパーツ' dist/pierce-duofon/index.html
          grep -Fq '1香箱' dist/cyma-time-o-vox/index.html
          grep -Fq '2香箱' dist/pierce-duofon/index.html

      - name: Guard small-screen CSS
        run: |
          set -e
          if grep -R -Fq 'word-break:break-all' dist/_astro; then
            echo 'break-all detected'
            exit 1
          fi
          if grep -R -Eiq 'width:[[:space:]]*[1-9][0-9]{3,}px' dist/_astro; then
            echo 'suspicious fixed width >= 1000px detected'
            exit 1
          fi

      - name: Upload staging build artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-history-v10-dist
          path: dist
          retention-days: 7
