name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build Astro site
        run: npm run build
      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/history/index.html
          test -f dist/history/smartwatch/index.html
          test -f dist/pierce-duofon/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          grep -q 'rel="canonical"' dist/index.html
          grep -q 'application/ld+json' dist/history/index.html
          grep -q '1950s。正解が、一つじゃなくなる。' dist/history/index.html
          grep -q 'raw.githubusercontent.com/orima1995-create/orima1995-creator.github.io/main/public/images/history/smartwatch.webp' dist/history/smartwatch/index.html
          grep -q 'Die Wecker-Armbanduhr Duofon mit zwei Lautstärken' dist/pierce-duofon/index.html
          ! grep -R -q 'word-break: break-all' dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live site
        run: |
          root="${{ steps.deployment.outputs.page_url }}"
          pierce="${root}pierce-duofon/"
          history="${root}history/"
          smart="${root}history/smartwatch/"
          sitemap="${root}sitemap.xml"
          for attempt in {1..12}; do
            pierce_html=$(curl -fsSL "$pierce" || true)
            history_html=$(curl -fsSL "$history" || true)
            smart_html=$(curl -fsSL "$smart" || true)
            sitemap_xml=$(curl -fsSL "$sitemap" || true)
            if grep -q "xkecjZqr7BY" <<<"$pierce_html" \
              && grep -q "正解が、一つじゃなくなる" <<<"$history_html" \
              && grep -q "smartwatch.webp" <<<"$smart_html" \
              && grep -q "pierce-duofon" <<<"$sitemap_xml"; then
              curl -fsSI "https://raw.githubusercontent.com/orima1995-create/orima1995-creator.github.io/main/public/images/history/smartwatch.webp" >/dev/null
              echo "Verified live site: $root"
              exit 0
            fi
            sleep 5
          done
          echo "Live verification failed: $root"
          exit 1
