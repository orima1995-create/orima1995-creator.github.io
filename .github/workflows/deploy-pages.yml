name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build Astro site
        run: npm run build
      - name: Verify build output
        run: |
          set -e
          check_file() {
            if [ -f "$1" ]; then
              echo "OK file: $1"
            else
              echo "FAIL missing: $1"
              exit 1
            fi
          }
          check_text() {
            if grep -Fq "$1" "$2"; then
              echo "OK text: $1"
            else
              echo "FAIL text: $1 in $2"
              exit 1
            fi
          }
          check_file dist/index.html
          check_file dist/history/index.html
          check_file dist/history/smartwatch/index.html
          check_file dist/pierce-duofon/index.html
          check_file dist/images/history/smartwatch-current.webp
          check_file dist/robots.txt
          check_file dist/sitemap.xml

          art_size=$(wc -c < dist/images/history/smartwatch-current.webp)
          echo "Artwork bytes: $art_size"
          [ "$art_size" -gt 30000 ] || { echo "FAIL artwork too small"; exit 1; }
          file dist/images/history/smartwatch-current.webp | grep -q 'Web/P image'

          check_text '自分のために知らせる' dist/history/index.html
          check_text 'PARKING WATCH' dist/history/index.html
          check_text 'PIERCE DUOFON' dist/history/index.html
          check_text 'smartwatch-current.webp' dist/history/smartwatch/index.html
          check_text 'もっと静かな時代へ戻る' dist/history/smartwatch/index.html
          check_text 'pierce-duofon' dist/sitemap.xml
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live site
        run: |
          root="${{ steps.deployment.outputs.page_url }}"
          history="${root}history/"
          smart="${root}history/smartwatch/"
          artwork="${root}images/history/smartwatch-current.webp"
          for attempt in {1..12}; do
            history_html=$(curl -fsSL "$history" || true)
            smart_html=$(curl -fsSL "$smart" || true)
            art_size=$(curl -fsSL "$artwork" 2>/dev/null | wc -c || true)
            if grep -Fq "自分のために知らせる" <<<"$history_html" \
              && grep -Fq "PARKING WATCH" <<<"$history_html" \
              && grep -Fq "smartwatch-current.webp" <<<"$smart_html" \
              && grep -Fq "もっと静かな時代へ戻る" <<<"$smart_html" \
              && [ "${art_size:-0}" -gt 30000 ]; then
              echo "Verified live site and smartwatch artwork: $root"
              exit 0
            fi
            sleep 5
          done
          echo "Live verification failed: $root"
          exit 1
