name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build Astro site
        run: npm run build
      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/history/index.html
          test -f dist/history/smartwatch/index.html
          test -f dist/pierce-duofon/index.html
          test -f dist/images/history/smartwatch.webp
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test $(wc -c < dist/images/history/smartwatch.webp) -gt 30000
          file dist/images/history/smartwatch.webp | grep -qi 'Web/P\|WebP'
          grep -q 'rel="canonical"' dist/index.html
          grep -q 'application/ld+json' dist/history/index.html
          grep -q 'アラーム腕時計が、一気に面白くなる。' dist/history/index.html
          grep -q 'OWNER.S NOTE / SPEC / 実機鳴動 / DEEP DIVE' dist/history/index.html
          grep -q '/orima1995-creator.github.io/images/history/smartwatch.webp' dist/history/smartwatch/index.html
          grep -q '現状の到達点。' dist/history/smartwatch/index.html
          grep -q 'Die Wecker-Armbanduhr Duofon mit zwei Lautstärken' dist/pierce-duofon/index.html
          ! grep -R -q 'word-break: break-all' dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live site
        run: |
          root="${{ steps.deployment.outputs.page_url }}"
          pierce="${root}pierce-duofon/"
          history="${root}history/"
          smart="${root}history/smartwatch/"
          artwork="${root}images/history/smartwatch.webp"
          sitemap="${root}sitemap.xml"
          for attempt in {1..12}; do
            pierce_html=$(curl -fsSL "$pierce" || true)
            history_html=$(curl -fsSL "$history" || true)
            smart_html=$(curl -fsSL "$smart" || true)
            sitemap_xml=$(curl -fsSL "$sitemap" || true)
            art_size=$(curl -fsSL "$artwork" 2>/dev/null | wc -c || true)
            if grep -q "xkecjZqr7BY" <<<"$pierce_html" \
              && grep -q "アラーム腕時計が、一気に面白くなる" <<<"$history_html" \
              && grep -q "OWNED / ARCHIVED" <<<"$history_html" \
              && grep -q "smartwatch.webp" <<<"$smart_html" \
              && grep -q "pierce-duofon" <<<"$sitemap_xml" \
              && [ "${art_size:-0}" -gt 30000 ]; then
              echo "Verified live site and smartwatch artwork: $root"
              exit 0
            fi
            sleep 5
          done
          echo "Live verification failed: $root"
          exit 1
