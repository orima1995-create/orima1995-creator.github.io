name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify Pierce page
        run: |
          url="${{ steps.deployment.outputs.page_url }}pierce-duofon/"
          for attempt in {1..12}; do
            if curl -fsSL "$url" | grep -q "<title>PIERCE DUOFON"; then
              echo "Verified: $url"
              exit 0
            fi
            sleep 5
          done
          echo "Verification failed: $url"
          exit 1
