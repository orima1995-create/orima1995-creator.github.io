name: Deploy legacy URL redirects

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/build-legacy-redirect.mjs"
      - "scripts/check-live-legacy-redirects.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build redirect site
        run: node scripts/build-legacy-redirect.mjs
      - name: Verify redirect output
        run: |
          set -euo pipefail
          for f in \
            legacy-dist/index.html \
            legacy-dist/404.html \
            legacy-dist/history/index.html \
            legacy-dist/owners-notes/index.html \
            legacy-dist/history/smartwatch/index.html \
            legacy-dist/basis-alarm/index.html \
            legacy-dist/pierce-duofon/index.html \
            legacy-dist/cyma-time-o-vox/index.html \
            legacy-dist/cyma-time-o-vox/owners-note/index.html \
            legacy-dist/citizen-alarm/index.html \
            legacy-dist/westclox-watchlarm/index.html \
            legacy-dist/lab/council/index.html \
            legacy-dist/robots.txt \
            legacy-dist/sitemap.xml \
            legacy-dist/googled3a96ed4c5eb9287.html; do
            test -f "$f" || { echo "missing redirect artifact: $f"; exit 1; }
          done
          grep -Fq 'https://vintagealarm.github.io/pierce-duofon/' legacy-dist/pierce-duofon/index.html
          grep -Fq 'https://vintagealarm.github.io/citizen-alarm/' legacy-dist/citizen-alarm/index.html
          grep -Fq 'https://vintagealarm.github.io/westclox-watchlarm/' legacy-dist/westclox-watchlarm/index.html
          grep -Fq 'location.search + location.hash' legacy-dist/pierce-duofon/index.html
          grep -Fq 'noindex,follow' legacy-dist/pierce-duofon/index.html
          grep -Fq '/orima1995-creator.github.io' legacy-dist/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload redirect site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./legacy-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live legacy redirects
        env:
          LEGACY_SITE_ROOT: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/check-live-legacy-redirects.mjs
