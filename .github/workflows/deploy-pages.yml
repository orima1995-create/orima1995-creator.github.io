name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build Astro site
        run: npm run build
      - name: Verify OWNER'S NOTES directory
        run: node scripts/check-owner-directory.mjs
      - name: Verify build output
        run: |
          set -e
          for f in \
            dist/index.html \
            dist/history/index.html \
            dist/history/smartwatch/index.html \
            dist/owners-notes/index.html \
            dist/pierce-duofon/index.html \
            dist/cyma-time-o-vox/index.html \
            dist/cyma-time-o-vox/owners-note/index.html \
            dist/images/history/smartwatch-part-1.webp \
            dist/images/history/smartwatch-part-2.webp \
            dist/images/history/smartwatch-part-3.webp \
            dist/images/history/smartwatch-part-4.webp \
            "dist/images/cyma-time-o-vox/Cyma timeovox .png" \
            "dist/images/cyma-time-o-vox/ムーブメント.jpg" \
            dist/images/cyma-time-o-vox/wipe.jpg \
            dist/robots.txt \
            dist/sitemap.xml; do
            test -f "$f" || { echo "missing file: $f"; exit 1; }
          done
          for f in dist/images/history/smartwatch-part-*.webp; do
            bytes=$(wc -c < "$f")
            echo "$f: ${bytes} bytes"
            test "$bytes" -gt 4000 || { echo "image too small: $f"; exit 1; }
          done
          cyma_bytes=$(wc -c < "dist/images/cyma-time-o-vox/Cyma timeovox .png")
          echo "Cyma OWNER'S NOTE PNG: ${cyma_bytes} bytes"
          test "$cyma_bytes" -gt 100000 || { echo "Cyma OWNER'S NOTE PNG is unexpectedly small"; exit 1; }
          movement_bytes=$(wc -c < "dist/images/cyma-time-o-vox/ムーブメント.jpg")
          wipe_bytes=$(wc -c < dist/images/cyma-time-o-vox/wipe.jpg)
          test "$movement_bytes" -gt 100000 || { echo "Cyma movement image is unexpectedly small"; exit 1; }
          test "$wipe_bytes" -gt 100000 || { echo "Cyma Wippe image is unexpectedly small"; exit 1; }
          check_text() {
            needle="$1"
            file="$2"
            grep -Fq "$needle" "$file" || { echo "missing text [$needle] in $file"; exit 1; }
          }
          check_text 'owners-notes/' dist/index.html
          check_text 'history/#milestones' dist/index.html
          check_text 'history/#research' dist/index.html
          check_text 'MEMOVOX AUTOMATIC / CAL.815' dist/history/index.html
          check_text 'MEMOVOX PARKING' dist/history/index.html
          check_text 'PIERCE DUOFON' dist/history/index.html
          check_text 'cyma-time-o-vox/' dist/history/index.html
          check_text 'id="milestones"' dist/history/index.html
          check_text 'id="research"' dist/history/index.html
          check_text 'owners-notes/' dist/history/index.html
          check_text '所有個体から見る。' dist/owners-notes/index.html
          check_text 'TIME-O-VOX' dist/owners-notes/index.html
          check_text 'DUOFON' dist/owners-notes/index.html
          check_text 'cyma-time-o-vox/#owners-note' dist/owners-notes/index.html
          check_text 'images/owners-thumbnails/cyma-time-o-vox-full.png' dist/owners-notes/index.html
          check_text 'images/owners-thumbnails/pierce-duofon-full.png' dist/owners-notes/index.html
          test -f dist/images/owners-thumbnails/cyma-time-o-vox-full.png
          test -f dist/images/owners-thumbnails/pierce-duofon-full.png
          check_text 'pierce-duofon/#owners-note' dist/owners-notes/index.html
          check_text 'smartwatch-part-4.webp' dist/history/smartwatch/index.html
          check_text 'もっと静かな時代へ戻る' dist/history/smartwatch/index.html
          check_text 'youtube.com/embed/xkecjZqr7BY' dist/pierce-duofon/index.html
          check_text 'Cal.R.464' dist/cyma-time-o-vox/index.html
          check_text 'ムーブメント.jpg' dist/cyma-time-o-vox/index.html
          check_text 'wipe.jpg' dist/cyma-time-o-vox/index.html
          check_text 'Cyma timeovox .png' dist/cyma-time-o-vox/index.html
          check_text 'Cyma timeovox .png' dist/cyma-time-o-vox/owners-note/index.html
          check_text 'youtube.com/embed/OONH0JZqCK0' dist/cyma-time-o-vox/index.html
          check_text '2085277918473883977' dist/cyma-time-o-vox/index.html
          check_text 'owners-notes' dist/sitemap.xml
          check_text 'cyma-time-o-vox' dist/sitemap.xml
          if grep -Fq '個体ページへ' dist/owners-notes/index.html; then
            echo "duplicate WATCH link remains in OWNER'S NOTES directory"
            exit 1
          fi
          for dead in '#index-milestones' '#index-owners' '#index-interests'; do
            if grep -R -Fq "$dead" dist; then
              echo "removed navigation target remains in generated output: $dead"
              exit 1
            fi
          done
          if grep -R -Fq 'runtime-menu' dist; then
            echo "legacy runtime navigation remains in generated output"
            exit 1
          fi
      - name: Install browser for layout check
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify rendered mobile layouts
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/vintage-alarm-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4321/orima1995-creator.github.io/ >/dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/check-layout.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live site
        run: |
          root="${{ steps.deployment.outputs.page_url }}"
          home="${root}"
          history="${root}history/"
          owners="${root}owners-notes/"
          smart="${root}history/smartwatch/"
          duofon="${root}pierce-duofon/"
          cyma="${root}cyma-time-o-vox/"
          cyma_note="${root}cyma-time-o-vox/owners-note/"
          sitemap="${root}sitemap.xml"
          verification="${root}googled3a96ed4c5eb9287.html"
          for attempt in {1..12}; do
            home_html=$(curl -fsSL "$home" || true)
            sitemap_xml=$(curl -fsSL "$sitemap" || true)
            verification_html=$(curl -fsSL "$verification" || true)
            history_html=$(curl -fsSL "$history" || true)
            owners_html=$(curl -fsSL "$owners" || true)
            smart_html=$(curl -fsSL "$smart" || true)
            duofon_html=$(curl -fsSL "$duofon" || true)
            cyma_html=$(curl -fsSL "$cyma" || true)
            cyma_note_html=$(curl -fsSL "$cyma_note" || true)
            parts_ok=1
            for n in 1 2 3 4; do
              size=$(curl -fsSL "${root}images/history/smartwatch-part-${n}.webp" 2>/dev/null | wc -c || true)
              [ "${size:-0}" -gt 4000 ] || parts_ok=0
            done
            cyma_size=$(curl -fsSL "${root}images/cyma-time-o-vox/Cyma%20timeovox%20.png" 2>/dev/null | wc -c || true)
            movement_size=$(curl -fsSL "${root}images/cyma-time-o-vox/%E3%83%A0%E3%83%BC%E3%83%96%E3%83%A1%E3%83%B3%E3%83%88.jpg" 2>/dev/null | wc -c || true)
            wipe_size=$(curl -fsSL "${root}images/cyma-time-o-vox/wipe.jpg" 2>/dev/null | wc -c || true)
            [ "${cyma_size:-0}" -gt 100000 ] || parts_ok=0
            [ "${movement_size:-0}" -gt 100000 ] || parts_ok=0
            [ "${wipe_size:-0}" -gt 100000 ] || parts_ok=0
            if grep -Fq "owners-notes/" <<<"$home_html" \
              && grep -Fq "history/#milestones" <<<"$home_html" \
              && grep -Fq "history/#research" <<<"$home_html" \
              && grep -Fq "MEMOVOX AUTOMATIC / CAL.815" <<<"$history_html" \
              && grep -Fq "MEMOVOX PARKING" <<<"$history_html" \
              && grep -Fq "id=\"milestones\"" <<<"$history_html" \
              && grep -Fq "id=\"research\"" <<<"$history_html" \
              && grep -Fq "cyma-time-o-vox/" <<<"$history_html" \
              && grep -Fq "owners-notes/" <<<"$history_html" \
              && grep -Fq "所有個体から見る。" <<<"$owners_html" \
              && grep -Fq "TIME-O-VOX" <<<"$owners_html" \
              && grep -Fq "DUOFON" <<<"$owners_html" \
              && grep -Fq "cyma-time-o-vox/#owners-note" <<<"$owners_html" \
              && grep -Fq "images/owners-thumbnails/cyma-time-o-vox-full.png" <<<"$owners_html" \
              && grep -Fq "images/owners-thumbnails/pierce-duofon-full.png" <<<"$owners_html" \
              && grep -Fq "pierce-duofon/#owners-note" <<<"$owners_html" \
              && ! grep -Fq "個体ページへ" <<<"$owners_html" \
              && grep -Fq "smartwatch-part-4.webp" <<<"$smart_html" \
              && grep -Fq "もっと静かな時代へ戻る" <<<"$smart_html" \
              && grep -Fq "youtube.com/embed/xkecjZqr7BY" <<<"$duofon_html" \
              && grep -Fq "Cal.R.464" <<<"$cyma_html" \
              && grep -Fq "ムーブメント.jpg" <<<"$cyma_html" \
              && grep -Fq "wipe.jpg" <<<"$cyma_html" \
              && grep -Fq "Cyma timeovox .png" <<<"$cyma_html" \
              && grep -Fq "Cyma timeovox .png" <<<"$cyma_note_html" \
              && grep -Fq "youtube.com/embed/OONH0JZqCK0" <<<"$cyma_html" \
              && grep -Fq "2085277918473883977" <<<"$cyma_html" \
              && ! grep -Fq "#index-milestones" <<<"$home_html$history_html" \
              && ! grep -Fq "#index-owners" <<<"$home_html$history_html" \
              && ! grep -Fq "#index-interests" <<<"$home_html$history_html" \
              && grep -Fq "<urlset" <<<"$sitemap_xml" \
              && grep -Fq "pierce-duofon/" <<<"$sitemap_xml" \
              && grep -Fq "cyma-time-o-vox/" <<<"$sitemap_xml" \
              && grep -Fq "google-site-verification: googled3a96ed4c5eb9287.html" <<<"$verification_html" \
              && [ "$parts_ok" -eq 1 ]; then
              echo "Verified live navigation, sitemap, Search Console file, watch videos, owners notes, Cyma media, and smartwatch artwork: $root"
              exit 0
            fi
            sleep 5
          done
          echo "Live verification failed: $root"
          exit 1
