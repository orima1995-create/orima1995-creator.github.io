name: Integration HISTORY v18 Audit

on:
  push:
    branches: ["integration/history-v18-main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard current main outside adopted scope
        run: |
          set -e
          base=6012f5f58f198abf6e03e1679ed5ef488027da47
          changed=$(git diff --name-only "$base" HEAD --             src/pages/index.astro             src/data             src/content             public/images/cyma-time-o-vox             public/images/pierce-duofon             .github/workflows/deploy-pages.yml)
          if [ -n "$changed" ]; then
            echo "Protected current-main source changed: $changed"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Audit HISTORY v18
        env:
          HISTORY_SCREENSHOT_DIR: .history-review
        run: node scripts/check-history-v18.mjs
      - name: Audit OWNER'S NOTES v16
        env:
          HISTORY_SCREENSHOT_DIR: .history-review
        run: node scripts/check-owners-v15.mjs
      - name: Guard core output
        run: |
          set -e
          for f in dist/index.html dist/history/index.html dist/owners-notes/index.html dist/pierce-duofon/index.html dist/cyma-time-o-vox/index.html dist/cyma-time-o-vox/owners-note/index.html; do
            test -f "$f"
          done
          grep -Fq 'VINTAGE ALARM' dist/index.html
          grep -Fq '1香箱' dist/cyma-time-o-vox/index.html
          grep -Fq '2香箱' dist/pierce-duofon/index.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-history-v18-review
          path: |
            dist/history
            dist/owners-notes
            dist/cyma-time-o-vox
            dist/pierce-duofon
            .history-review
          include-hidden-files: true
          retention-days: 7
