name: Freeze Astro lockfile

on:
  push:
    branches: ["refactor/astro-foundation"]
    paths:
      - '.github/workflows/freeze-astro-lock.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/astro-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile
        run: npm install --package-lock-only
      - name: Commit lockfile and remove one-off workflow
        run: |
          rm .github/workflows/freeze-astro-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/freeze-astro-lock.yml
          git commit -m "chore: lock Astro dependencies"
          git push origin refactor/astro-foundation
