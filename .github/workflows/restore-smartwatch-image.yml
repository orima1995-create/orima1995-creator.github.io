name: Restore smartwatch image

on:
  push:
    branches: ["main"]
    paths:
      - ".tmp/smartwatch.ready"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild image
        run: |
          cat .tmp/smartwatch.part* | base64 -d > public/images/history/smartwatch.webp
          test $(wc -c < public/images/history/smartwatch.webp) -gt 100000
          file public/images/history/smartwatch.webp | grep -qi 'Web/P\|WebP'
      - name: Commit restored binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/history/smartwatch.webp
          git rm .tmp/smartwatch.part* .tmp/smartwatch.ready
          git rm .github/workflows/restore-smartwatch-image.yml
          git commit -m "fix: restore smartwatch artwork"
          git push origin HEAD:main
