name: Extract Duofon legacy content

on:
  push:
    branches: ["refactor/astro-foundation"]
    paths:
      - '.github/workflows/migrate-duofon-assets.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/astro-foundation

      - name: Extract visible text and Owner's Note image
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import base64
          import re

          src = Path('pierce-duofon/index.html')
          html = src.read_text(encoding='utf-8')

          # Decode the embedded Owner's Note JPEG into a normal asset file.
          m = re.search(r'data:image/jpeg;base64,([^"\']+)', html)
          if not m:
              raise SystemExit('Embedded Owner\'s Note JPEG was not found')
          image_path = Path('public/images/pierce-duofon/owners-note.jpg')
          image_path.parent.mkdir(parents=True, exist_ok=True)
          image_path.write_bytes(base64.b64decode(m.group(1)))

          # Export all user-visible text without styles/scripts or giant data attributes.
          class VisibleText(HTMLParser):
              block_tags = {'p','h1','h2','h3','li','dt','dd','summary','div','section','header','a'}
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.skip = 0
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag in {'style','script'}:
                      self.skip += 1
                  elif not self.skip and tag in self.block_tags:
                      self.parts.append('\n')
              def handle_endtag(self, tag):
                  if tag in {'style','script'} and self.skip:
                      self.skip -= 1
                  elif not self.skip and tag in self.block_tags:
                      self.parts.append('\n')
              def handle_data(self, data):
                  if not self.skip:
                      s = ' '.join(data.split())
                      if s:
                          self.parts.append(s)

          parser = VisibleText()
          parser.feed(html)
          text = ''.join(parser.parts)
          lines = []
          for raw in text.splitlines():
              line = ' '.join(raw.split())
              if line and (not lines or line != lines[-1]):
                  lines.append(line)

          migration = Path('.migration/legacy-duofon-visible-text.txt')
          migration.parent.mkdir(parents=True, exist_ok=True)
          migration.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit extracted migration assets
        run: |
          rm .github/workflows/migrate-duofon-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: extract Duofon migration assets"
          git push origin refactor/astro-foundation
