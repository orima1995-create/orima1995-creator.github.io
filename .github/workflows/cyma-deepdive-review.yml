name: CYMA deep dive visual audit
on:
  push:
    branches: ["staging/cyma-deepdive-v19"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - env:
          CYMA_SCREENSHOT_DIR: .cyma-review
        run: node scripts/check-cyma-deepdive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cyma-deepdive-review
          path: .cyma-review
          include-hidden-files: true
          retention-days: 7
